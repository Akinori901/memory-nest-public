services:
  # ローカルDynamoDB
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: memory-nest-dynamodb
    ports:
      - "8787:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - dynamodb-data:/data

  # LocalStack (S3, Cognito のローカルエミュレーション)
  localstack:
    image: localstack/localstack:latest
    container_name: memory-nest-localstack
    ports:
      - "4567:4566"   # LocalStack Gateway (4567に変更: chibicとの競合回避)
      - "4510-4559:4510-4559" # ext services
    environment:
      - SERVICES=s3,cognito-idp
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dynamodb-data:
  localstack-data:
